
name: Deploy MSP Course Planner

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Production source
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: production

      # Testing source
      - name: Checkout development
        uses: actions/checkout@v6
        with:
          ref: development
          path: development

      - name: Prepare both websites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/dev

          # Publish main at the website root
          cp -a "production/MSP Course Planner/." "_site/"

          # Publish development under /dev/
          cp -a "development/MSP Course Planner/." "_site/dev/"

          # Make development use its own branch for
          # remote data and version checks
          sed -i \
            's#raw.githubusercontent.com/arthurgallaxy/msp-course-lab-selector-development/main/MSP%20Course%20Planner/#raw.githubusercontent.com/arthurgallaxy/msp-course-lab-selector-development/development/MSP%20Course%20Planner/#g' \
            "_site/dev/planner-v1.html"

          # Provide entry points for both versions
          cp "_site/planner-v1.html" "_site/index.html"
          cp "_site/dev/planner-v1.html" "_site/dev/index.html"

          # Serve static files without Jekyll processing
          touch "_site/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
